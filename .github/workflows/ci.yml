name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run, so an
# older commit can never publish "latest" after a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted || (mix format && git diff && exit 1)
      - run: mix test
      # mix.lock must list every dependency in mix.exs; otherwise the first
      # mix deps.get of every installation changes it. Prints what is missing.
      - run: git diff --exit-code mix.lock

  # Builds the Docker image natively for each platform and runs the end-to-end
  # test of the Docker package on it. On main and on version tags the tested
  # image is also pushed (by digest; docker-publish below tags it).
  docker:
    name: docker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

    steps:
      - uses: actions/checkout@v4

      - name: Image name and labels
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          {
            echo "LABELS<<EOF"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.title=Potion Zeitgeist"
            echo "org.opencontainers.image.description=Time tracking with projects and invoices"
            echo "org.opencontainers.image.licenses=MIT"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ env.LABELS }}
          load: true
          tags: potion_zeitgeist:ci
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Test the Docker package (start, update, keep data)
        run: .github/scripts/docker-smoke-test.sh potion_zeitgeist:ci

      - name: Log in to the GitHub container registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build as above (from the cache), pushed without a tag.
      - name: Push image by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ env.LABELS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}

      - name: Save digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-platform images into one image for Intel/AMD and ARM
  # (e.g. Apple Silicon) and tags it: "latest" and "sha-<commit>" from main,
  # "1.2.3", "1.2" and "1" from a tag v1.2.3. Only runs when the tests and the
  # Docker checks passed.
  docker-publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # Optional copy on Docker Hub: set the repository variable
      # DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN to enable it.
      - name: Image names
        id: images
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          {
            echo "list<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "docker.io/${DOCKERHUB_USERNAME,,}/potion_zeitgeist"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          # "latest" only from main, not from version tags.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create multi-platform image
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Show image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

      # Other installations download the image without logging in.
      - name: Check that the image can be downloaded without login
        run: |
          docker logout ghcr.io
          if ! docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}" >/dev/null; then
            echo "::warning::$IMAGE cannot be downloaded without login. Make the package public once: GitHub profile > Packages > potion_zeitgeist > Package settings > Change visibility > Public."
          fi
