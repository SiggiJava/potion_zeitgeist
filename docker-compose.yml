# Potion Zeitgeist with its own PostgreSQL database.
#
#   Start:   docker compose up -d            then open http://localhost:4000
#   Update:  docker compose pull && docker compose up -d
#
# This file is all another installation needs; settings go into an optional
# .env file next to it (see .env.example). All data lives in the two named
# volumes at the bottom. Updating, restarting or recreating the containers
# keeps them. Only `docker compose down -v` or `docker volume rm` deletes them.
#
# In a clone of the repository, docker-compose.override.yml is picked up as
# well, and `docker compose up -d --build` builds the image from the source.

services:
  db:
    # Stay on PostgreSQL 16: a newer major version cannot open this data
    # volume without a dump and restore (see README, "Docker").
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      # Only used when the volume is created for the first time.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: potion_zeitgeist_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d potion_zeitgeist_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/siggijava/potion_zeitgeist:${APP_VERSION:-latest}
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      DATABASE_URL: ecto://postgres:${POSTGRES_PASSWORD:-postgres}@db/potion_zeitgeist_prod
      # Empty means: use the keys generated on first start (app_data volume).
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      VAULT_KEY: ${VAULT_KEY:-}
      PHX_HOST: ${PHX_HOST:-localhost}
      FORCE_SSL: ${FORCE_SSL:-false}
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  # Fixed names, so the data is found again even when this file is moved to
  # another folder (Compose would otherwise prefix the folder name).
  postgres_data:
    name: potion_zeitgeist_postgres_data
  app_data:
    name: potion_zeitgeist_app_data
